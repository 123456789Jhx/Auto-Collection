name: auto-collection

services:
  postgres:
    image: postgres:16-alpine
    container_name: auto-collection-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - auto_collection_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: auto-collection-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - auto_collection_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ${APP_SOURCE_DIR:-.}
      dockerfile: deploy/docker/Dockerfile.api
    image: ${API_IMAGE:-ghcr.io/dafengchan/auto-collection/api:latest}
    pull_policy: ${APP_PULL_POLICY:-always}
    container_name: auto-collection-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-root}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      ADMIN_TOKEN_TTL_SECONDS: ${ADMIN_TOKEN_TTL_SECONDS:-86400}
      MOBILE_REGISTRATION_SECRET: ${MOBILE_REGISTRATION_SECRET:?MOBILE_REGISTRATION_SECRET is required}
      MOBILE_REQUEST_SIGNING_REQUIRED: ${MOBILE_REQUEST_SIGNING_REQUIRED:?MOBILE_REQUEST_SIGNING_REQUIRED must be true}
      MOBILE_REQUEST_TIMESTAMP_SKEW_SECONDS: ${MOBILE_REQUEST_TIMESTAMP_SKEW_SECONDS:-300}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ${APP_SOURCE_DIR:-.}
      dockerfile: deploy/docker/Dockerfile.web
      args:
        VITE_API_BASE_URL_PROD: ${VITE_API_BASE_URL_PROD:-https://qk-api.dafengchan.top/api/v1}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://qk-api.dafengchan.top/api/v1}
    image: ${WEB_IMAGE:-ghcr.io/dafengchan/auto-collection/web:latest}
    pull_policy: ${APP_PULL_POLICY:-always}
    container_name: auto-collection-web
    restart: unless-stopped
    ports:
      - "${WEB_BIND_HOST:-127.0.0.1}:${WEB_PUBLIC_PORT:-9026}:80"
    volumes:
      - ./public/downloads:/app/public/downloads:ro
    depends_on:
      - api

  db-push:
    build:
      context: ${APP_SOURCE_DIR:-.}
      dockerfile: deploy/docker/Dockerfile.api
    image: ${API_IMAGE:-ghcr.io/dafengchan/auto-collection/api:latest}
    pull_policy: ${APP_PULL_POLICY:-always}
    profiles:
      - tools
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-root}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["bun", "--filter", "@pkg/db", "db:push"]

volumes:
  auto_collection_postgres:
  auto_collection_redis:
